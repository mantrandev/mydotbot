- defaults:
    link:
      relink: true
      force: true

- shell:
    - command: brew bundle --file=Brewfile
      description: Install Homebrew packages and apps
      stdin: true
      stdout: true
    - command: scripts/install-vscode-extensions.sh
      description: Install VS Code extensions
      stdout: true
    - command: scripts/install-npm-globals.sh
      description: Install npm global packages
      stdout: true

- create:
    - ~/.claude
    - ~/.claude-company
    - ~/.codex
    - ~/.codex/skills
    - ~/.codex-1
    - ~/.codex-1/skills
    - ~/.pi/agent
    - ~/.pi/agent/skills
    - ~/.agents_common
    - ~/.zsh

- link:
    ~/.zshrc: zsh/.zshrc
    ~/.zshenv: zsh/.zshenv
    ~/.zprofile: zsh/.zprofile
    ~/.zsh/jira.zsh: zsh/jira.zsh
    ~/.gitconfig: git/.gitconfig
    ~/.gitconfig-github: git/.gitconfig-github
    ~/.config/git/ignore:
      path: git/ignore
      create: true
    ~/.claude/statusline-command.sh: zsh/statusline-command.sh
    ~/.claude-company/statusline-command.sh: zsh/statusline-command.sh
    ~/.claude/CLAUDE.md: ai/claude/CLAUDE.md
    ~/.claude/skills: ai/skills-claude
    ~/.claude/memory: ai/memory
    ~/.claude-company/CLAUDE.md: ai/claude-company/CLAUDE.md
    ~/.claude-company/skills: ai/skills-company
    ~/.claude-company/memory: ai/memory-company
    ~/.codex/AGENTS.md: ai/CLAUDE.md
    ~/.codex-1/AGENTS.md: ai/CLAUDE.md
    ~/.codex-1/rules:
      path: ~/.codex/rules
    ~/.codex/skills/analyzing-source-code: ai/skills/analyzing-source-code
    ~/.codex/skills/analyzing-video: ai/skills/analyzing-video
    ~/.codex/skills/archify: ai/skills/archify
    ~/.codex/skills/build-adhoc-dev: ai/skills/build-adhoc-dev
    ~/.codex/skills/clean-claude-sessions: ai/skills/clean-claude-sessions
    ~/.codex/skills/commit: ai/skills/commit
    ~/.codex/skills/create-desc-mr: ai/skills/create-desc-mr
    ~/.codex/skills/create-gitlab-mr: ai/skills/create-gitlab-mr
    ~/.codex/skills/create-slack-message-mr: ai/skills/create-slack-message-mr
    ~/.codex/skills/debugging-ios: ai/skills/debugging-ios
    ~/.codex/skills/find-skills: ai/skills/find-skills
    ~/.codex/skills/blueprint-html: ai/skills/blueprint-html
    ~/.codex/skills/jira-acli: ai/skills/jira-acli
    ~/.codex/skills/liquid-glass-ios: ai/skills/liquid-glass-ios
    ~/.codex/skills/mr-pipeline: ai/skills/mr-pipeline
    ~/.codex/skills/orca-cli: ai/skills/orca-cli
    ~/.codex/skills/planning-feature: ai/skills/planning-feature
    ~/.codex/skills/reverse-engineer-anything: ai/skills/reverse-engineer-anything
    ~/.codex/skills/ios-test-failure-triage: ai/skills/ios-test-failure-triage
    ~/.codex/skills/sim-validation-flow: ai/skills/sim-validation-flow
    ~/.codex/skills/simulate-notification: ai/skills/simulate-notification
    ~/.codex/skills/tracking-events: ai/skills/tracking-events
    ~/.codex/skills/usage-dashboard: ai/skills/usage-dashboard
    ~/.codex/skills/writing-unit-tests: ai/skills/writing-unit-tests
    ~/.pi/agent/AGENTS.md: ai/CLAUDE.md
    ~/.pi/agent/skills/blueprint-html: ai/skills/blueprint-html
    ~/.pi/agent/themes/claude-code-dark.json: pi/themes/claude-code-dark.json
    ~/.pi/agent/extensions/claude-style-footer.ts: pi/extensions/claude-style-footer.ts
    ~/.agents_common/AGENTS.md: ai/CLAUDE.md
    ~/.agents_common/skills: ai/skills
    ~/.config/herdr/config.toml:
      path: herdr/config.toml
      create: true

- shell:
    - command: scripts/install-claude-plugins.sh
      description: Synchronize Claude Code plugins across accounts
      stdout: true
    - command: scripts/install-codex-plugins.sh
      description: Synchronize Matt Pocock plugin for Codex
      stdout: true
    - command: scripts/install-herdr-integrations.sh
      description: Install herdr agent hooks and Codex title for all profiles
      stdout: true
